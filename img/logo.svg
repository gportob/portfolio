<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#11161D"/>
      <stop offset="1" stop-color="#0B0F14"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <rect x="4" y="4" width="504" height="504" rx="104" fill="none" stroke="#212B36" stroke-width="4"/>

  <!-- wordmark: <g/> -->
  <text x="256" y="298" text-anchor="middle"
        font-family="DejaVu Sans Mono, monospace" font-weight="bold" font-size="150">
    <tspan fill="#6EE7C7">&lt;</tspan><tspan fill="#E6EDF3">g</tspan><tspan fill="#FF7AC6">/</tspan><tspan fill="#6EE7C7">&gt;</tspan>
  </text>

  <!-- underline accent, echoes the terminal cursor -->
  <rect x="176" y="336" width="160" height="14" rx="7" fill="#8B98A5" opacity="0.35"/>
</svg>
